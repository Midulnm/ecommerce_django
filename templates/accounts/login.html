{% extends 'base.html' %}

{% block title %}Login - TeeStore{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-200px)] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Welcome Back</h1>
            <p class="mt-2 text-gray-600">Sign in to your account</p>
        </div>
        
        <div class="bg-white rounded-2xl shadow-sm p-8">
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                            {{ field.label }}
                        </label>
                        <input type="{% if field.name == 'password' %}password{% else %}text{% endif %}" 
                               name="{{ field.name }}" 
                               id="{{ field.id_for_label }}"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
                        {% if field.errors %}
                            <p class="mt-1 text-sm text-red-600">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
                
                <button type="submit" class="w-full py-3 bg-gray-900 text-white font-semibold rounded-lg hover:bg-gray-800 transition-colors">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    Don't have an account? 
                    <a href="{% url 'register' %}" class="text-primary-600 hover:text-primary-700 font-medium">
                        Sign up
                    </a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
