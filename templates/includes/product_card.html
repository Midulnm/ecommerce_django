<div class="group">
    <a href="{% url 'product_detail' product.slug %}" class="block">
        <div class="relative overflow-hidden rounded-xl bg-gray-100 aspect-[3/4]">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}" 
                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            {% else %}
                <div class="w-full h-full flex items-center justify-center bg-gray-200">
                    <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
            {% endif %}
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300"></div>
        </div>
        <div class="mt-4">
            <h3 class="text-gray-900 font-medium group-hover:text-primary-600 transition-colors">{{ product.name }}</h3>
            <div class="flex items-center justify-between mt-1">
                <p class="text-lg font-bold text-gray-900">${{ product.price }}</p>
                <p class="text-sm text-gray-500">{{ product.sizes }}</p>
            </div>
        </div>
    </a>
</div>
